<!DOCTYPE html>
<html>
<head>
    <title>WoTLK UI Overlay</title>
    <style>
        body {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }
        .overlay {
            background: rgba(20, 20, 40, 0.9);
            border: 2px solid #00ff00;
            border-radius: 8px;
            padding: 15px;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        h1 {
            margin-top: 0;
            color: #00ff00;
            font-size: 20px;
        }
        .stat {
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
        }
        .label {
            color: #aaa;
        }
        .value {
            color: #00ff00;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>Game Status</h1>
        <div class="stat">
            <span class="label">FPS:</span>
            <span class="value" id="fps">60</span>
        </div>
        <div class="stat">
            <span class="label">Location:</span>
            <span class="value" id="location">Unknown</span>
        </div>
        <div class="stat">
            <span class="label">Players Online:</span>
            <span class="value" id="players">0</span>
        </div>
    </div>

    <script>
        // Function to receive game state updates from the game thread
        window.updateGameState = function(gameData) {
            try {
                if (gameData.fps !== undefined) {
                    document.getElementById('fps').textContent = "60";
                }
                if (gameData.location !== undefined) {
                    document.getElementById('location').textContent = gameData.location;
                }
                if (gameData.playersOnline !== undefined) {
                    document.getElementById('players').textContent = gameData.playersOnline;
                }
            } catch(e) {
                console.error('Error updating game state:', e);
            }
        };

        console.log('UI initialized and ready for game state updates');
    </script>
</body>
</html>
